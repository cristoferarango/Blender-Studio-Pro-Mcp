[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-studio-pro-mcp"
version = "2.0.0"
description = "Blender Studio Pro MCP — 100% Blender control from Cursor, Claude, Codex, OpenCode, DeepSeek (Apache-2.0)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Cristofer Arango", email = "contact@corporacionarango.com" },
]
maintainers = [
  { name = "Cristofer Arango", email = "contact@corporacionarango.com" },
]
keywords = ["blender", "mcp", "ai", "3d", "cursor", "claude", "codex", "opencode", "deepseek"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "mcp>=1.9.0,<2",
]

[project.urls]
Homepage = "https://corporacionarango.com"
Repository = "https://github.com/cristoferarango/Blender-Studio-Pro-Mcp"
Documentation = "https://corporacionarango.com"

[project.scripts]
blender-studio-pro-mcp = "server.server:main"
blender-mcp = "server.server:main"

[tool.setuptools]
packages = ["server"]
include-package-data = true

[tool.setuptools.package-data]
server = ["commands_catalog.json", "blender_categories.py"]
